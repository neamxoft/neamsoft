<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente de fondo premium -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0052cc"/>
      <stop offset="100%" stop-color="#003399"/>
    </linearGradient>
    <!-- Glow sutil para la N -->
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
    <linearGradient id="nGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d8f0"/>
    </linearGradient>
  </defs>

  <!-- Background cuadrado con esquinas de app icon -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Sombra interna sutil -->
  <rect width="512" height="512" rx="112" ry="112" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- N geométrica formada por nodos y trazos gruesos -->
  <!-- Glow detrás -->
  <g filter="url(#softGlow)" opacity="0.3">
    <path d="M148 380 L148 132 L364 380 L364 132" stroke="#93c5fd" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- N principal - trazos gruesos y limpios -->
  <path d="M148 380 L148 132 L364 380 L364 132" stroke="url(#nGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- 4 nodos brillantes en las esquinas de la N -->
  <g fill="#ffffff">
    <circle cx="148" cy="380" r="32"/>
    <circle cx="148" cy="132" r="32"/>
    <circle cx="364" cy="380" r="32"/>
    <circle cx="364" cy="132" r="32"/>
  </g>

  <!-- Brillo sutil en los nodos -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="142" cy="126" r="12"/>
    <circle cx="142" cy="374" r="12"/>
    <circle cx="358" cy="126" r="12"/>
    <circle cx="358" cy="374" r="12"/>
  </g>
</svg>
